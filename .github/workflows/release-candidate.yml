name: Prepare release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from package.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: besh-windows-self-hosted
  cancel-in-progress: false

defaults:
  run:
    shell: powershell

jobs:
  candidate:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun-windows
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun scripts/release-check.ts
        env:
          BESH_RELEASE_VERSION: ${{ inputs.version }}
      - run: bun run check
      - run: bunx playwright install chromium
      - run: bun run test:e2e
      - run: bun run build:portable
      - run: bun run test:portable
        env:
          BESH_TEST_PORTABLE_EXE: '${{ github.workspace }}\.cache\portable\besh-windows-x64.exe'
          DEBUG: ''
          PWDEBUG: ''
      - run: bun run package:portable
      - run: bun scripts/release-bundle.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: besh-release-candidate
          path: |
            .cache/release-candidate/
            .cache/portable-release-*.zip
            .cache/portable-release-*.zip.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
