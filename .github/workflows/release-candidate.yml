name: Prepare release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from package.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: besh-windows-self-hosted
  cancel-in-progress: false

defaults:
  run:
    shell: powershell

jobs:
  candidate:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun-windows
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun scripts/release-check.ts
        env:
          BESH_RELEASE_VERSION: ${{ inputs.version }}
      - run: bun run check
      - run: bunx playwright install chromium
      - run: bun run test:e2e
      - run: bun scripts/release-bundle.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: besh-release-candidate
          path: .cache/release-candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
