name: Check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: besh-windows-self-hosted
  cancel-in-progress: false

defaults:
  run:
    shell: powershell

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun-windows
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun scripts/release-check.ts
        env:
          BESH_RELEASE_BASE_SHA: ${{ github.event.before }}
          BESH_RELEASE_COMMIT_SHA: ${{ github.sha }}
      - run: bun run check

  browser:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun-windows
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun run test:e2e

  portable:
    needs: browser
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.22.1'
          package-manager-cache: false
      - uses: ./.github/actions/setup-bun-windows
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun scripts/build-portable.ts
      - run: bun run test:portable
        env:
          BESH_TEST_PORTABLE_EXE: '${{ github.workspace }}\.cache\portable\besh-windows-x64.exe'
          DEBUG: ''
          PWDEBUG: ''
